# Gradle
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx2560m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.caching=true
# https://github.com/gradle/kotlin-dsl/issues/311
org.gradle.configureondemand=false
# Kotlin
kotlin.incremental.usePreciseJavaTracking=true
# Android
android.builder.sdkDownload=true
android.enableD8.desugaring=true
# AndroidX
android.useAndroidX=true
android.enableJetifier=true
org.gradle.configuration-cache=true
# ---------------------------------------------------------------------------
# Your app. Change these before your first Play Store upload.
# The application id can never change after the app is published.
app.name=RetroLink
app.applicationId=com.retrolink.emulator
app.versionCode=1
app.versionName=1.0.0
# Address of your room server (see server/README.md), e.g. https://rooms.example.com
# Leave empty to hide online rooms until you set one up.
app.onlineServerUrl=
# Custom link scheme used by invite links, e.g. retrolink://join/ABC123
app.linkScheme=retrolink
